# DEMO: Rolls cartservice back to the healthy configuration.
#
# PREFERRED:
#   ./deploy/observe/demo-fix.sh
#
# Legacy: kubectl apply -f deploy/observe/demo-rollback-cartservice.yaml
#
# What happens:
#   - cartservice pods restart with the correct REDIS_ADDR
#   - Error rate drops back to zero in Observe APM
#   - A second deployment marker appears marking the recovery

apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
  annotations:
    deployment.version: "v2-fixed"
    deployment.change: "restored correct REDIS_ADDR"
spec:
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      serviceAccountName: cartservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: cartservice
        ports:
        - containerPort: 7070
        env:
        - name: REDIS_ADDR
          value: "redis-cart:6379"   # <-- correct host restored
        resources:
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 15
          grpc:
            port: 7070
        livenessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          grpc:
            port: 7070
