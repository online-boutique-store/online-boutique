# Ephemeral EKS cluster for Online Boutique (us-east-1)
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: online-boutique
  region: us-east-1
  version: "1.32"

managedNodeGroups:
  - name: ng-default
    instanceType: t3.medium
    desiredCapacity: 3
    minSize: 2
    maxSize: 4
    volumeSize: 30
