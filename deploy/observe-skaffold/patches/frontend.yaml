apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: observe-otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: frontend
            - name: ACCOUNT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: shopping-assistant-account-api
                  key: ACCOUNT_API_SECRET
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Enables the /assistant page + /bot proxy to shoppingassistantservice.
            - name: ENABLE_ASSISTANT
              value: "true"
