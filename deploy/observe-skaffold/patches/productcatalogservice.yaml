apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
spec:
  template:
    spec:
      containers:
        - name: server
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: observe-otel-env
          env:
            - name: OTEL_SERVICE_NAME
              value: productcatalogservice
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
