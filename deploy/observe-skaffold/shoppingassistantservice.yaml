# Shopping assistant: an Amazon Bedrock (Converse API) tool-calling agent (see docs/ai-demo.md).
#
# Lives in this overlay (not kubernetes-manifests/) on purpose: kustomize cannot
# read files outside its root, and the assistant needs AWS IAM setup the default
# deploy doesn't have, so it is opt-in to the Observe/skaffold deploy only.
#
# AWS credentials: NONE are configured here. The pod gets them from the standard
# AWS chain via its ServiceAccount, using either EKS Pod Identity (an association
# for namespace/serviceaccount -> IAM role) or IRSA (uncomment the annotation on
# the ServiceAccount below). The role needs bedrock:Converse/InvokeModel on the
# chosen model or inference profile. See docs/ai-demo.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shoppingassistantservice
  template:
    metadata:
      labels:
        app: shoppingassistantservice
    spec:
      serviceAccountName: shoppingassistantservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: shoppingassistantservice
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        readinessProbe:
          periodSeconds: 5
          httpGet:
            path: /healthz
            port: 8080
        livenessProbe:
          periodSeconds: 10
          httpGet:
            path: /healthz
            port: 8080
        env:
        - name: ACCOUNT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: shopping-assistant-account-api
              key: ACCOUNT_API_SECRET
        - name: ACCOUNTS_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: accounts-db-credentials
              key: ACCOUNTS_DATABASE_URL
              # optional: the pod must still start (guest shopping works) if the Secret is absent
              optional: true
        - name: OTEL_SERVICE_NAME
          value: shoppingassistantservice
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # observe-otel-env sets OTEL_LOGS_EXPORTER=none for the other services;
        # the assistant ships its logs over OTLP so trace_id/span_id are stamped
        # on every record (explicit env beats envFrom).
        - name: OTEL_LOGS_EXPORTER
          value: otlp
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: CART_SERVICE_ADDR
          value: "cartservice:7070"
        - name: CURRENCY_SERVICE_ADDR
          value: "currencyservice:7000"
        - name: CHECKOUT_SERVICE_ADDR
          value: "checkoutservice:5050"
        # Assistant behaviour + incident switches live in one ConfigMap so a
        # demo toggle is a single `kubectl set env`/patch (see docs/ai-demo.md).
        envFrom:
        - configMapRef:
            name: observe-otel-env
        - configMapRef:
            name: shopping-assistant-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shoppingassistantservice
  labels:
    app: shoppingassistantservice
spec:
  type: ClusterIP
  selector:
    app: shoppingassistantservice
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shoppingassistantservice
  # IRSA: the EKS pod-identity webhook injects AWS_ROLE_ARN + a projected web
  # identity token, which boto3 picks up. Role is created per docs/ai-demo.md.
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::739672403694:role/ob-shoppingassistant-bedrock
