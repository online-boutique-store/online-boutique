# accountservice - WRITTEN BUT NOT APPLIED (local-only milestone). Namespace online-boutique only.
# Before applying (separate approval): build linux/amd64 with --provenance=false, push, and replace
# `image:` with the immutable digest reference (repo@sha256:...).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accountservice
  namespace: online-boutique
  labels: {app: accountservice}
spec:
  replicas: 1
  selector:
    matchLabels: {app: accountservice}
  template:
    metadata:
      labels: {app: accountservice}
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: accountservice   # REPLACE with repo@sha256:<digest>
          ports:
            - {containerPort: 8081, name: grpc}
          env:
            - {name: PORT, value: "8081"}
            - {name: ENABLE_TRACING, value: "1"}
            - {name: OTEL_SERVICE_NAME, value: accountservice}
            - {name: REDIS_ADDR, value: "redis-cart:6379"}
            - {name: ORDER_QUEUE_ADDR, value: "order-queue:6379"}
            - {name: PAYMENT_SERVICE_ADDR, value: "paymentservice:50051"}   # Tokenize (demo catalog cards only)
            - name: K8S_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: K8S_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: ACCOUNTS_DATABASE_URL
              valueFrom: {secretKeyRef: {name: accounts-db-credentials, key: ACCOUNTS_DATABASE_URL}}
            - name: ACCOUNT_SERVICE_SECRETS
              valueFrom: {secretKeyRef: {name: accountservice-credentials, key: ACCOUNT_SERVICE_SECRETS}}
            - name: TELEMETRY_REF_KEY
              valueFrom: {secretKeyRef: {name: accountservice-credentials, key: TELEMETRY_REF_KEY}}
          envFrom:
            - configMapRef: {name: observe-otel-env-f25gc92hdt}   # OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_RESOURCE_ATTRIBUTES (service.version)
          readinessProbe:
            grpc: {port: 8081}
            periodSeconds: 5
          livenessProbe:
            grpc: {port: 8081}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: accountservice
  namespace: online-boutique
  labels: {app: accountservice}
spec:
  type: ClusterIP
  selector: {app: accountservice}
  ports:
    - {name: grpc, port: 8081, targetPort: 8081}
---
# Only the three trusted callers may reach accountservice (enforced where the CNI supports NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: accountservice-ingress
  namespace: online-boutique
spec:
  podSelector:
    matchLabels: {app: accountservice}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: frontend}}
        - podSelector: {matchLabels: {app: shoppingassistantservice}}
        - podSelector: {matchLabels: {app: checkoutservice}}
      ports:
        - {port: 8081, protocol: TCP}
