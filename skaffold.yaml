apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  artifacts:
  # image tags are relative; to specify an image repo (e.g. GCR), you
  # must provide a "default repo" using one of the methods described
  # here:
  # https://skaffold.dev/docs/concepts/#image-repository-handling
  - image: emailservice
    context: src/emailservice
  - image: productcatalogservice
    context: src/productcatalogservice
  - image: recommendationservice
    context: src/recommendationservice
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
  - image: shippingservice
    context: src/shippingservice
  - image: checkoutservice
    context: src/checkoutservice
  - image: paymentservice
    context: src/paymentservice
  - image: currencyservice
    context: src/currencyservice
  - image: cartservice
    context: src/cartservice/src
    docker:
      dockerfile: Dockerfile
  - image: frontend
    context: src/frontend
  - image: adservice
    context: src/adservice
  tagPolicy:
    gitCommit: {}
  local:
    # Was false. The legacy (non-BuildKit) builder is deprecated (Docker
    # flags this on every build: "The legacy builder is deprecated and will
    # be removed in a future release") and noticeably less stable building
    # many images back-to-back/concurrently — "Docker build ran into
    # internal error. Please retry." is a legacy-builder failure mode, not
    # something specific to this project's config. BuildKit is the current
    # default builder and what Docker actually recommends now.
    useBuildkit: true
    # Explicit push: true — the EKS cluster is remote, so Skaffold already
    # defaults to pushing, but this makes it unambiguous in CI where the
    # kubeconfig/context isn't set up until a later step, which could
    # otherwise confuse Skaffold's local-vs-remote cluster auto-detection.
    push: true
manifests:
  kustomize:
    paths:
    # Was: kubernetes-manifests (bare, no OTEL wiring, no namespace control).
    # Now points at deploy/observe-skaffold, which layers the same OTEL
    # patches used by deploy/observe on top of the bare manifests, without
    # deploy/aws's ECR_URI_PLACEHOLDER image rewrite (which would break
    # Skaffold's own image substitution). Pass --namespace=online-boutique
    # on the CLI to control where this lands; see
    # deploy/observe-skaffold/kustomization.yaml for the full explanation.
    - deploy/observe-skaffold
deploy:
  kubectl: {}
# "gcb" profile allows building and pushing the images
# on Google Container Builder without requiring docker
# installed on the developer machine. However, note that
# since GCB does not cache the builds, each build will
# start from scratch and therefore take a long time.
#
# This is not used by default. To use it, run:
#     skaffold run -p gcb
profiles:
- name: gcb
  build:
    googleCloudBuild:
      diskSizeGb: 300
      machineType: N1_HIGHCPU_32
      timeout: 4000s
# "debug" profile replaces the default Dockerfile in cartservice with Dockerfile.debug,
# which enables debugging via skaffold.
#
# This profile is used by default when running skaffold debug.
- name: debug
  activation:
  - command: debug
  patches:
  - op: replace
    path: /build/artifacts/7/docker/dockerfile
    value: Dockerfile.debug
# The "network-policies" profile is not used by default.
# You can use it in isolation or in combination with other profiles:
#     skaffold run -p network-policies, debug
- name: network-policies
  patches:
  - op: add
    path: /manifests/kustomize/paths/1
    value: kustomize/components/network-policies
---
apiVersion: skaffold/v3
kind: Config
metadata:
  name: loadgenerator
requires:
- configs:
  - app
build:
  artifacts:
  - image: loadgenerator
    context: src/loadgenerator
manifests:
  rawYaml:
  - ./kubernetes-manifests/loadgenerator.yaml
deploy:
  kubectl: {}
profiles:
- name: gcb
  build:
    googleCloudBuild:
      diskSizeGb: 300
      machineType: N1_HIGHCPU_32
      timeout: 4000s
